name: Deploy Test

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  IMAGE_TAG_LATEST: test-latest
  BACKEND_DIR: project/aitoearn-backend
  WEB_DIR: project/aitoearn-web
  NX_NO_CLOUD: true
  NX_DAEMON: false

jobs:
  build-web:
    name: Build web image
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
      image_sha_tag: ${{ steps.meta.outputs.image_sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image metadata
        id: meta
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="$(git rev-parse --short HEAD)"
          echo "image_prefix=${image_prefix}" >> "${GITHUB_OUTPUT}"
          echo "image_sha_tag=test-${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WEB_DIR }}
          file: ${{ env.WEB_DIR }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}/aitoearn-web:${{ env.IMAGE_TAG_LATEST }}
            ${{ steps.meta.outputs.image_prefix }}/aitoearn-web:${{ steps.meta.outputs.image_sha_tag }}
          cache-from: type=gha,scope=aitoearn-web
          cache-to: type=gha,mode=max,scope=aitoearn-web
          provenance: false
          sbom: false

  build-backend:
    name: Build backend images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - aitoearn-ai
          - aitoearn-server
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Prepare Docker context
        working-directory: ${{ env.BACKEND_DIR }}
        run: pnpm nx run ${{ matrix.app }}:docker-context

      - name: Prepare image metadata
        id: meta
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="$(git rev-parse --short HEAD)"
          echo "image_prefix=${image_prefix}" >> "${GITHUB_OUTPUT}"
          echo "image_sha_tag=test-${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}/tmp/docker-context
          file: ${{ env.BACKEND_DIR }}/tmp/docker-context/Dockerfile
          platforms: linux/amd64
          build-args: |
            APP_NAME=${{ matrix.app }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}/${{ matrix.app }}:${{ env.IMAGE_TAG_LATEST }}
            ${{ steps.meta.outputs.image_prefix }}/${{ matrix.app }}:${{ steps.meta.outputs.image_sha_tag }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: false
          sbom: false

  deploy:
    name: Deploy to 192.168.3.6
    needs:
      - build-web
      - build-backend
    runs-on:
      - self-hosted
      - linux
      - aitoearn-test
    env:
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_DIR: /home/btcfoxman/docker/aitoearn
      APP_PORT: "8081"
    steps:
      - name: Fetch deployment files
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          work_dir="${RUNNER_TEMP:-/tmp}/${repo_name}-repo-${GITHUB_RUN_ID}"
          rm -rf "${work_dir}"
          mkdir -p "${work_dir}"

          auth_config="${work_dir}/.curl-auth"
          {
            printf 'header = "Authorization: Bearer %s"\n' "${CHECKOUT_TOKEN}"
            printf 'header = "Accept: application/vnd.github.raw"\n'
            printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
          } > "${auth_config}"
          chmod 600 "${auth_config}"

          download_file() {
            local path="$1"
            mkdir -p "${work_dir}/$(dirname "${path}")"
            curl --config "${auth_config}" \
              --fail --location --silent --show-error \
              --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 120 \
              -o "${work_dir}/${path}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_SHA}"
          }

          for file in \
            test/deploy.sh \
            test/docker-compose.yml \
            test/nginx.conf \
            test/.env.example \
            scripts/init.mjs \
            scripts/init-package.json \
            project/aitoearn-backend/apps/aitoearn-ai/config/config.js \
            project/aitoearn-backend/apps/aitoearn-server/config/config.js
          do
            download_file "${file}"
          done

          rm -f "${auth_config}"
          chmod +x "${work_dir}/test/deploy.sh"
          echo "REPO_WORK_DIR=${work_dir}" >> "${GITHUB_ENV}"

      - name: Deploy
        run: |
          set -euo pipefail
          cd "${REPO_WORK_DIR}"
          bash test/deploy.sh

  provision-geoflow-runner:
    name: Provision GEOFlow test runner
    needs: deploy
    runs-on:
      - self-hosted
      - linux
      - aitoearn-test
    timeout-minutes: 10
    env:
      REGISTRATION_TOKEN: ${{ secrets.GEOFLOW_RUNNER_REGISTRATION_TOKEN }}
      RUNNER_ARCHIVE_PROXY_URLS: "http://127.0.0.1:10809 http://xray:10809 direct"
    steps:
      - name: Register dedicated GEOFlow runner
        if: ${{ env.REGISTRATION_TOKEN != '' }}
        run: |
          set -euo pipefail

          source_root="$(cd "$(dirname "${RUNNER_TEMP}")/.." && pwd)"
          runner_version="$("${source_root}/bin/Runner.Listener" --version)"
          target_root="/home/btcfoxman/actions-runner-geoflow-v2"

          if [ ! -f "${target_root}/.runner" ]; then
            mkdir -p "${target_root}"
            runner_archive="${RUNNER_TEMP}/actions-runner-linux-x64-${runner_version}.tar.gz"
            cached_archive="$(find /home/btcfoxman/actions-runners -maxdepth 3 -type f -name 'actions-runner-linux-x64-*.tar.gz' -print -quit 2>/dev/null || true)"

            if [ -n "${cached_archive}" ] && tar -tzf "${cached_archive}" >/dev/null 2>&1; then
              cp -f "${cached_archive}" "${runner_archive}"
            else
              download_url="https://github.com/actions/runner/releases/download/v${runner_version}/actions-runner-linux-x64-${runner_version}.tar.gz"
              downloaded=false
              for proxy_url in ${RUNNER_ARCHIVE_PROXY_URLS}; do
                proxy_args=()
                if [ "${proxy_url}" != "direct" ]; then
                  proxy_args=(--proxy "${proxy_url}")
                fi
                rm -f "${runner_archive}"
                if curl \
                  --fail \
                  --location \
                  --retry 3 \
                  --retry-all-errors \
                  --retry-delay 5 \
                  --connect-timeout 20 \
                  --max-time 300 \
                  "${proxy_args[@]}" \
                  --output "${runner_archive}" \
                  "${download_url}" \
                  && tar -tzf "${runner_archive}" >/dev/null 2>&1; then
                  downloaded=true
                  break
                fi
              done
              if [ "${downloaded}" != "true" ]; then
                echo "Unable to obtain a valid GitHub Actions runner archive" >&2
                exit 1
              fi
            fi
            tar -xzf "${runner_archive}" -C "${target_root}"

            cd "${target_root}"
            ./config.sh \
              --unattended \
              --url "https://github.com/btcfoxman/GEOFlow" \
              --token "${REGISTRATION_TOKEN}" \
              --name "geoflow-test-3-6" \
              --labels "aitoearn-test" \
              --work "_work" \
              --replace
          else
            cd "${target_root}"
          fi

          if sudo -n true 2>/dev/null; then
            if [ ! -f "/etc/systemd/system/actions.runner.btcfoxman-GEOFlow.geoflow-test-3-6.service" ]; then
              sudo ./svc.sh install "$(id -un)"
            fi
            sudo ./svc.sh start
            sudo ./svc.sh status
          else
            mkdir -p "${target_root}/_diag"
            nohup env RUNNER_TRACKING_ID= ./run.sh >"${target_root}/_diag/background.log" 2>&1 </dev/null &
            runner_pid=$!
            sleep 5
            kill -0 "${runner_pid}"
          fi
