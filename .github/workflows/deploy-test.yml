name: Deploy Test

on:
  push:
    branches:
      - test
  workflow_dispatch:
    inputs:
      run_server_browser_regression:
        description: 'Opt in only on a browser-capable LAN host; normally run the full browser regression on the local workstation.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: aitoearn-test-${{ github.ref }}
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  IMAGE_TAG_LATEST: test-latest
  BACKEND_DIR: project/aitoearn-backend
  WEB_DIR: project/aitoearn-web
  NX_NO_CLOUD: true
  NX_DAEMON: false

jobs:
  quality-backend:
    name: Test orchestration import idempotency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Run orchestration import regression tests
        working-directory: ${{ env.BACKEND_DIR }}
        run: >-
          pnpm exec vitest run
          --config apps/aitoearn-server/vitest.config.mts
          --environment node
          src/core/internal/orchestration-draft-import.spec.ts
          src/core/internal/material.repository.import.spec.ts
          src/core/internal/orchestration-outcome.spec.ts
          --reporter=verbose

      - name: Check bounded deployment health contracts
        run: node --test test/deploy-contract.test.mjs test/cold-start-cancellation.test.mjs test/lan-resource-lock.test.mjs test/storage-readiness.test.mjs

      - name: Check approved publishing tenant boundary
        working-directory: ${{ env.BACKEND_DIR }}
        run: >-
          pnpm exec vitest run
          --config apps/aitoearn-server/vitest.config.mts
          --environment node
          src/core/channel/publishing/publishing.service.spec.ts
          -t 'approved tenant scope'
          --reporter=verbose

      - name: Type-check publishing integration
        working-directory: ${{ env.BACKEND_DIR }}
        run: pnpm exec tsc --noEmit -p apps/aitoearn-server/tsconfig.app.json

  quality-web:
    name: Test web state stability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.WEB_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Run PublishDialog state regression tests
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm exec playwright test tests/unit/publish-dialog-state-sync.spec.ts --reporter=line

      - name: Type-check web
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm type-check

  build-web:
    name: Build web image
    needs: quality-web
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
      image_sha_tag: ${{ steps.meta.outputs.image_sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image metadata
        id: meta
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_prefix=${image_prefix}" >> "${GITHUB_OUTPUT}"
          echo "image_sha_tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WEB_DIR }}
          file: ${{ env.WEB_DIR }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}/aitoearn-web:${{ env.IMAGE_TAG_LATEST }}
            ${{ steps.meta.outputs.image_prefix }}/aitoearn-web:${{ steps.meta.outputs.image_sha_tag }}
          cache-from: type=gha,scope=aitoearn-web
          cache-to: type=gha,mode=max,scope=aitoearn-web
          provenance: false
          sbom: false

  build-backend:
    name: Build backend images
    needs: quality-backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - aitoearn-ai
          - aitoearn-server
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Prepare Docker context
        working-directory: ${{ env.BACKEND_DIR }}
        run: pnpm nx run ${{ matrix.app }}:docker-context

      - name: Prepare image metadata
        id: meta
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_prefix=${image_prefix}" >> "${GITHUB_OUTPUT}"
          echo "image_sha_tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}/tmp/docker-context
          file: ${{ env.BACKEND_DIR }}/tmp/docker-context/Dockerfile
          platforms: linux/amd64
          build-args: |
            APP_NAME=${{ matrix.app }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}/${{ matrix.app }}:${{ env.IMAGE_TAG_LATEST }}
            ${{ steps.meta.outputs.image_prefix }}/${{ matrix.app }}:${{ steps.meta.outputs.image_sha_tag }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: false
          sbom: false

  deploy:
    name: Deploy to 192.168.3.6
    needs:
      - build-web
      - build-backend
    environment: test
    runs-on:
      - self-hosted
      - linux
      - aitoearn-test
    env:
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AITOEARN_INTERNAL_API_KEY: ${{ secrets.AITOEARN_INTERNAL_API_KEY }}
      IMAGE_TAG: ${{ needs.build-web.outputs.image_sha_tag }}
      APP_DIR: /home/btcfoxman/docker/aitoearn
      APP_PORT: "8081"
    steps:
      - name: Fetch deployment files
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          work_dir="${RUNNER_TEMP:-/tmp}/${repo_name}-repo-${GITHUB_RUN_ID}"
          rm -rf "${work_dir}"
          mkdir -p "${work_dir}"

          auth_config="${work_dir}/.curl-auth"
          {
            printf 'header = "Authorization: Bearer %s"\n' "${CHECKOUT_TOKEN}"
            printf 'header = "Accept: application/vnd.github.raw"\n'
            printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
          } > "${auth_config}"
          chmod 600 "${auth_config}"

          download_file() {
            local path="$1"
            mkdir -p "${work_dir}/$(dirname "${path}")"
            curl --config "${auth_config}" \
              --fail --location --silent --show-error \
              --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 120 \
              -o "${work_dir}/${path}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_SHA}"
          }

          for file in \
            test/deploy.sh \
            test/lan-resource-lock.sh \
            test/verify-storage-readiness.mjs \
            test/docker-compose.yml \
            test/nginx.conf \
            test/.env.example \
            scripts/init.mjs \
            scripts/init-package.json \
            project/aitoearn-backend/apps/aitoearn-ai/config/config.js \
            project/aitoearn-backend/apps/aitoearn-server/config/config.js
          do
            download_file "${file}"
          done

          rm -f "${auth_config}"
          chmod +x "${work_dir}/test/deploy.sh"
          echo "REPO_WORK_DIR=${work_dir}" >> "${GITHUB_ENV}"

      - name: Deploy
        run: |
          set -euo pipefail
          cd "${REPO_WORK_DIR}"
          exec bash test/deploy.sh

  verify-deployed-page:
    name: Verify deployed page availability (not browser acceptance)
    needs: deploy
    environment: test
    runs-on:
      - self-hosted
      - linux
      - aitoearn-test
    timeout-minutes: 5
    env:
      AITOEARN_E2E_BASE_URL: ${{ vars.AITOEARN_E2E_BASE_URL || 'http://192.168.3.6:8081/zh-CN' }}
    steps:
      - name: Check application HTML without starting a server-side browser
        run: |
          set -euo pipefail
          umask 077
          body_file="$(mktemp)"
          trap 'rm -f "${body_file}"' EXIT
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              --output "${body_file}" "${AITOEARN_E2E_BASE_URL}" \
              && grep -qi '<html' "${body_file}" \
              && grep -q '_next/static/' "${body_file}"; then
              echo "Application HTML is reachable. Full browser acceptance runs on the local workstation; this check does not certify it."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Application HTML did not become ready within the bounded window"
          exit 1

  verify-web-e2e:
    name: Optional server browser cold-start regression
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_server_browser_regression }}
    needs: deploy
    environment: test
    runs-on:
      - self-hosted
      - linux
      - aitoearn-test
    timeout-minutes: 40
    env:
      AITOEARN_E2E_BASE_URL: ${{ vars.AITOEARN_E2E_BASE_URL || 'http://192.168.3.6:8081/zh-CN' }}
      AITOEARN_E2E_ATTEMPTS: ${{ vars.AITOEARN_E2E_ATTEMPTS || '10' }}
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - name: Fetch E2E files
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work_dir="${RUNNER_TEMP:-/tmp}/aitoearn-e2e-${GITHUB_RUN_ID}"
          rm -rf "${work_dir}"
          mkdir -p "${work_dir}/tests/e2e"

          auth_config="${work_dir}/.curl-auth"
          cleanup_auth() {
            rm -f "${auth_config}"
          }
          trap cleanup_auth EXIT
          {
            printf 'header = "Authorization: Bearer %s"\n' "${CHECKOUT_TOKEN}"
            printf 'header = "Accept: application/vnd.github.raw"\n'
            printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
          } > "${auth_config}"
          chmod 600 "${auth_config}"

          download_file() {
            local path="$1"
            local destination="$2"
            curl --config "${auth_config}" \
              --fail --location --silent --show-error \
              --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 120 \
              -o "${destination}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_SHA}"
          }

          download_file "test/cold-start/package.json" "${work_dir}/package.json"
          download_file "test/cold-start/pnpm-lock.yaml" "${work_dir}/pnpm-lock.yaml"
          download_file "test/run-cold-start-regression.sh" "${work_dir}/run-cold-start-regression.sh"
          download_file "test/lan-resource-lock.sh" "${work_dir}/lan-resource-lock.sh"
          download_file \
            "${WEB_DIR}/tests/e2e/cold-start-stability.spec.ts" \
            "${work_dir}/tests/e2e/cold-start-stability.spec.ts"

          rm -f "${auth_config}"
          trap - EXIT
          echo "E2E_WORK_DIR=${work_dir}" >> "${GITHUB_ENV}"

      - name: Wait for deployed web page
        run: |
          set -euo pipefail
          if [ -z "${AITOEARN_E2E_BASE_URL:-}" ]; then
            echo "::error::AITOEARN_E2E_BASE_URL is required"
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              "${AITOEARN_E2E_BASE_URL}" >/dev/null; then
              exit 0
            fi
            echo "Waiting for deployed web page (${attempt}/30)"
            sleep 5
          done

          echo "::error::Deployed web page did not become ready"
          exit 1

      - name: Run deployed cold-start regression
        run: |
          set -euo pipefail
          exec bash "${E2E_WORK_DIR}/run-cold-start-regression.sh"
